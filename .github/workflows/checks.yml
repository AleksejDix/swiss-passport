# Quality checks on every push and pull request. They do not deploy: Cloudflare Workers Builds deploys main on its own.
#   checks: lint, format, types, content files, engine and server tests
#   e2e:    the site in a browser against the real Worker (wrangler dev with a local D1 database)
#   pack:   the Claude Desktop extension (mcp/swiss-passport-zh.mcpb): a build artifact on every run, and on main
#           the asset of the GitHub Release desktop-v<manifest version>, which the website links as the latest release
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:data
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack --workspace=swiss-passport-zh
      - uses: actions/upload-artifact@v4
        with:
          name: swiss-passport-zh.mcpb
          path: mcp/swiss-passport-zh.mcpb
          retention-days: 30
      - name: Publish as the GitHub Release of the manifest version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v$(node -p "require('./mcp/manifest.json').version")"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Claude Desktop extension ${tag#desktop-v}" \
              --notes "Download swiss-passport-zh.mcpb and open it in Claude Desktop. Built from $GITHUB_SHA."
          gh release upload "$tag" mcp/swiss-passport-zh.mcpb --clobber
