<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --line: #e5e5ea;
        --card: #f5f5f7;
        --red: #d52b1e;
        --ok: #1f8a4c;
        --bad: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1c1e;
          --fg: #f2f2f7;
          --muted: #a1a1a6;
          --line: #3a3a3c;
          --card: #2c2c2e;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1c1e;
        --fg: #f2f2f7;
        --muted: #a1a1a6;
        --line: #3a3a3c;
        --card: #2c2c2e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #root {
        padding: 16px;
        max-width: 640px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }
      .bar {
        height: 4px;
        background: var(--line);
        border-radius: 2px;
        margin: 6px 0 14px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--red);
        transition: width 0.3s;
      }
      .banner {
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .banner.ok {
        background: color-mix(in srgb, var(--ok) 15%, transparent);
        color: var(--ok);
      }
      .banner.bad {
        background: color-mix(in srgb, var(--bad) 13%, transparent);
        color: var(--bad);
      }
      .concept {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .terms {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .chip {
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .question {
        font-size: 17px;
        font-weight: 600;
      }
      .german {
        color: var(--muted);
        font-size: 14px;
        margin-top: 2px;
      }
      .picture {
        display: block;
        max-width: 100%;
        border-radius: 10px;
        margin-top: 10px;
      }
      .options {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }
      .options.grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .option {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .options.grid .option {
        flex-direction: column;
      }
      .option img {
        width: 100%;
        max-height: 160px;
        object-fit: contain;
      }
      .option:hover:not(:disabled) {
        border-color: var(--red);
      }
      .option:disabled {
        cursor: default;
        opacity: 0.6;
      }
      .option.chosen {
        opacity: 1;
        border-color: var(--red);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 30%, transparent);
      }
      .letter {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        background: var(--red);
        color: #fff;
      }
      .done {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        padding: 20px;
      }
      .para {
        margin: 0 0 10px;
      }
      .muted {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .choice-title {
        display: block;
        font-weight: 600;
      }
      .choice-unit {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .next {
        margin-top: 4px;
        padding: 10px 18px;
        border: 0;
        border-radius: 12px;
        background: var(--red);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      /*CARD_JS*/
    </script>
  </body>
</html>
